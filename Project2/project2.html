<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebGL Cube Grid</title>
  <style>
    html, body { margin: 0; height: 100%; background: black; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    #info {
      position: fixed;
      top: 6px;
      left: 6px;
      padding: 6px 7px;
      background: rgba(0, 0, 0, 0);
      color: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      font-size: 10px;
      font-kerning: none;
      font-family: 'Courier New';
      line-height: 1.4;
    }

    #info2 {
      position: fixed;
      bottom: 6px;
      left: 6px;
      padding: 6px 7px;
      background: rgba(0, 0, 0, 0);
      color: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      font-size: 18px;
      font-kerning: none;
      font-family: 'Courier New';
      line-height: 1.4;
    }

  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="./project2.js"></script>

  <div id="info">
    <b>[UP -> Zoom In] [DOWN -> Zoom Out]   [LEFT -> Lower Resolution]   [RIGHT -> Higher Resolution]   [MINUS -> Lower Depth]   [PLUS -> Higher Depth]   [#1-4 -> Level Picker] </b><br>
  </div>

  <div id="info2">
    <b>Hills of University of Cincinnati</b><br>
  </div>

</body>
</html>
